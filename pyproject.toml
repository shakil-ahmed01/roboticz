[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "smartwash"
version = "0.1.0"
description = "AI brain for smart washing machines: cycle recommendation, fault detection and remote control"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "pydantic>=2.5",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "paho-mqtt>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
smartwash = "smartwash.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/smartwash"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# Optional no-op hooks on abstract base classes are intentional.
ignore = ["B027"]
